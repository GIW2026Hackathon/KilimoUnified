{% extends 'base.html' %} {% block content %}
<main class="min-h-screen bg-base-200 p-6">
  <section class="card mx-auto mt-12 w-full max-w-lg bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title">Dashboard</h1>
      <p>Welcome, {{ user.username }}!</p>
      <section class="mt-4">
        <h2 class="text-lg font-semibold">Your farms</h2>
        {% if farms %}
        <ul class="mt-2 space-y-2">
          {% for farm in farms %}
          <li>
            <a
              class="link link-hover"
              href="{% url 'weather:farm_forecast' farm.id %}"
              >{{ farm.name }} weather</a
            >
          </li>
          {% endfor %}
        </ul>
        {% else %}
        <p class="mt-2 text-base-content/70">
          No farms are linked to your account yet.
        </p>
        {% endif %}
      </section>
      <form
        action="{% url 'accounts:logout' %}"
        method="post"
        class="card-actions mt-4"
      >
        {% csrf_token %}
        <button class="btn" type="submit">Sign out</button>
      </form>
    </div>
  </section>
</main>
{% endblock %}
