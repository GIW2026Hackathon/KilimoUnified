openapi: 3.0.3
info:
  title: Open-Meteo Forecast API dependency used by the Django weather client
  version: 1.0.0
servers:
  - url: https://api.open-meteo.com
paths:
  /v1/forecast:
    get:
      summary: Retrieve daily rainfall and temperature forecast data
      parameters:
        - in: query
          name: latitude
          required: true
          schema: { type: number }
        - in: query
          name: longitude
          required: true
          schema: { type: number }
        - in: query
          name: daily
          required: true
          schema: { type: string }
        - in: query
          name: forecast_days
          required: true
          schema: { type: integer, minimum: 1, maximum: 16 }
        - in: query
          name: timezone
          required: true
          schema: { type: string }
        - in: query
          name: temperature_unit
          required: true
          schema: { type: string, enum: [celsius] }
        - in: query
          name: precipitation_unit
          required: true
          schema: { type: string, enum: [mm] }
      responses:
        "200":
          description: Daily forecast indicators and units.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone: { type: string, example: Africa/Nairobi }
                  daily_units:
                    type: object
                    properties:
                      precipitation_sum: { type: string, example: mm }
                      temperature_2m_min: { type: string, example: "°C" }
                      temperature_2m_max: { type: string, example: "°C" }
                      time: { type: string, example: "iso8601" }
                  daily:
                    type: object
                    properties:
                      time:
                        type: array
                        items: { type: string, format: date }
                      precipitation_sum:
                        type: array
                        items: { type: number, nullable: true }
                      temperature_2m_min:
                        type: array
                        items: { type: number, nullable: true }
                      temperature_2m_max:
                        type: array
                        items: { type: number, nullable: true }
              example:
                timezone: Africa/Nairobi
                daily_units:
                  time: iso8601
                  precipitation_sum: mm
                  temperature_2m_min: "°C"
                  temperature_2m_max: "°C"
                daily:
                  time: ["2026-10-27"]
                  precipitation_sum: [0]
                  temperature_2m_min: [13.1]
                  temperature_2m_max: [24.7]
        "503":
          description: Simulated upstream provider outage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason: { type: string }
              example: { reason: simulated weather provider outage }
